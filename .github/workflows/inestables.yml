# Busca tests inestables: corre toda la suite (unitarios, integracion y E2E) 3 veces en paralelo.
# Se dispara a mano desde Actions o empujando un tag inestables-N
name: Tests inestables (3 corridas)

on:
  workflow_dispatch:
  push:
    tags: ['inestables-*']

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: aura
  COMPOSE_PROJECT: aura

jobs:
  corrida:
    name: Corrida ${{ matrix.corrida }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        corrida: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unitarios + integracion
        run: mvn -B -ntp verify

      - name: Levantar todo
        run: docker compose up -d --build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e/requirements.txt
      - run: |
          pip install -r e2e/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Esperar a la app
        run: |
          for i in $(seq 1 120); do
            curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/repuestos/login.xhtml | grep -q 200 && exit 0
            sleep 2
          done
          exit 1
      - name: E2E
        working-directory: e2e
        run: python -m pytest --junitxml=resultados-e2e.xml

      - name: Resumen
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = 0
          for x in glob.glob('target/*-reports/TEST-*.xml') + ['e2e/resultados-e2e.xml']:
              try:
                  for s in ET.parse(x).getroot().iter('testsuite'):
                      t += int(s.get('tests')); f += int(s.get('failures')) + int(s.get('errors'))
              except FileNotFoundError:
                  pass
          print(f"::notice title=Corrida ${{ matrix.corrida }}::{t} tests, {f} con falla")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrida-${{ matrix.corrida }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            e2e/resultados-e2e.xml
          if-no-files-found: ignore

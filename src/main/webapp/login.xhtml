<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Aura Cycles: repuestos de bicicleta con rese&#241;as y devoluciones"/>
  <title>Ingresar | Aura Cycles</title>
  <h:outputStylesheet library="css" name="app.css"/>
</h:head>

<h:body styleClass="#{sesion.claseTema}">
  <div class="login-pantalla">
    <div class="login-card">

      <div class="login-marca">
        <div class="sidebar-logo">
        <svg class="marca" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <circle cx="16" cy="16" r="12.5" stroke-width="3.4" stroke-dasharray="2.2 1.73"/>
          <circle cx="16" cy="16" r="3"/>
          <path d="M16 7.500v5.500M24.100 11.300l-4.800 2.800M24.100 20.700l-4.800-2.800M16 24.500V19M7.900 20.700l4.800-2.800M7.900 11.300l4.800 2.800"/>
        </svg>
        </div>
        <div class="marca-login">Aura Cycles</div>
      </div>

      <div class="mensajes">
        <h:messages infoClass="info" errorClass="error" layout="list"
                    showDetail="false" showSummary="true"/>
      </div>

      <ui:fragment rendered="#{not loginBean.mostrandoRegistro}">
        <h:form>
          <h1 class="login-titulo">Ingres&#225; a tu cuenta</h1>
          <p class="login-bajada">Tus compras, rese&#241;as y devoluciones de repuestos, en un solo lugar.</p>

          <div class="campo">
            <h:outputLabel for="email" value="Email"/>
            <h:inputText id="email" maxlength="120" value="#{loginBean.email}"
                         autocomplete="username"/>
          </div>

          <div class="campo">
            <h:outputLabel for="pass" value="Contrase&#241;a"/>
            <h:inputSecret id="pass" value="#{loginBean.password}"
                           autocomplete="current-password"/>
          </div>

          <div class="form-acciones">
            <h:commandButton value="Ingresar" action="#{loginBean.ingresar}"
                             styleClass="btn btn-primario"/>
            <h:commandButton value="Crear una cuenta"
                             action="#{loginBean.alternarRegistro}"
                             styleClass="btn-enlace campo-ayuda"/>
          </div>
        </h:form>
      </ui:fragment>

      <ui:fragment rendered="#{loginBean.mostrandoRegistro}">
        <h:form>
          <h1 class="login-titulo">Cre&#225; tu cuenta</h1>
          <p class="login-bajada">Con la cuenta pod&#233;s comprar, rese&#241;ar lo que compraste y pedir devoluciones.</p>

          <div class="campo">
            <h:outputLabel for="nom" value="Nombre y apellido"/>
            <h:inputText id="nom" maxlength="120" value="#{loginBean.nombreNuevo}"/>
          </div>

          <div class="campo">
            <h:outputLabel for="mailN" value="Email"/>
            <h:inputText id="mailN" maxlength="120" value="#{loginBean.emailNuevo}"/>
          </div>

          <div class="campo">
            <h:outputLabel for="passN" value="Contrase&#241;a"/>
            <h:inputSecret id="passN" value="#{loginBean.passwordNueva}"
                           autocomplete="new-password"/>
            <span class="campo-ayuda">Al menos 8 caracteres.</span>
          </div>

          <div class="form-acciones">
            <h:commandButton value="Crear cuenta" action="#{loginBean.registrarse}"
                             styleClass="btn btn-primario"/>
            <h:commandButton value="Ya tengo cuenta"
                             action="#{loginBean.alternarRegistro}"
                             styleClass="btn-enlace campo-ayuda"/>
          </div>
        </h:form>
      </ui:fragment>

    </div>
  </div>
</h:body>
</html>

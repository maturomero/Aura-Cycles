<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Aura Cycles: repuestos de bicicleta con rese&#241;as y devoluciones"/>
  <title><ui:insert name="titulo">Aura Cycles</ui:insert> | Aura Cycles</title>
  <h:outputStylesheet library="css" name="app.css"/>
</h:head>

<h:body styleClass="#{sesion.claseTema}">

  <input type="checkbox" id="menu" class="oculto"/>

  <div class="layout">

    <label for="menu" class="backdrop"><h:outputText value=""/></label>

    <aside class="sidebar">

      <div class="sidebar-marca">
        <div class="sidebar-logo">
        <svg class="marca" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <circle cx="16" cy="16" r="12.5" stroke-width="3.4" stroke-dasharray="2.2 1.73"/>
          <circle cx="16" cy="16" r="3"/>
          <path d="M16 7.500v5.500M24.100 11.300l-4.800 2.800M24.100 20.700l-4.800-2.800M16 24.500V19M7.900 20.700l4.800-2.800M7.900 11.300l4.800 2.800"/>
        </svg>
        </div>
        <div>
          <div class="sidebar-nombre">Aura Cycles</div>
          <div class="sidebar-sub">Repuestos de bicicleta</div>
        </div>
      </div>

      <nav class="nav">
        <span class="nav-titulo">Tienda</span>

        <h:link outcome="productos"
                styleClass="#{seccion eq 'productos' ? 'activo' : ''}">
          <svg class="nav-icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8.500"/>
            <circle cx="12" cy="12" r="2"/>
            <path d="M12 3.500v6.500M12 14v6.500M3.500 12H10M14 12h6.500"/>
          </svg>
          <span class="etiqueta">Productos</span>
        </h:link>

        <h:link outcome="compras"
                styleClass="#{seccion eq 'compras' ? 'activo' : ''}">
          <svg class="nav-icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 3.500h12v17l-3-2-3 2-3-2-3 2z"/>
            <path d="M9 8.500h6M9 12.500h6"/>
          </svg>
          <span class="etiqueta">Mis compras</span>
        </h:link>

        <h:link outcome="perfil"
                styleClass="#{seccion eq 'perfil' ? 'activo' : ''}">
          <svg class="nav-icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="8.500" r="4"/>
            <path d="M4.500 20.500c1-4 4-5.500 7.500-5.500s6.500 1.500 7.500 5.500"/>
          </svg>
          <span class="etiqueta">Perfil</span>
        </h:link>

        <ui:fragment rendered="#{sesion.moderador}">
          <span class="nav-titulo">Moderaci&#243;n</span>
          <h:link outcome="moderacion"
                  styleClass="#{seccion eq 'moderacion' ? 'activo' : ''}">
            <svg class="nav-icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 3l7.500 3v5.500c0 4.500-3 8-7.500 9.500-4.500-1.500-7.500-5-7.500-9.500V6z"/>
              <path d="M8.500 12l2.500 2.500 4.500-5"/>
            </svg>
            <span class="etiqueta">Panel</span>
          </h:link>
        </ui:fragment>
      </nav>

    </aside>

    <div>

      <header class="topbar">
        <label for="menu" class="hamburguesa" aria-label="Abrir el men&#250;">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </label>

        <h1 class="topbar-titulo">
          <ui:insert name="titulo">Panel</ui:insert>
        </h1>

        <div class="topbar-derecha">
          <h:form>
            <h:commandButton value="#{sesion.temaOscuro ? 'Tema claro' : 'Tema oscuro'}"
                             action="#{sesion.alternarTema}"
                             styleClass="btn-tema"/>
          </h:form>

          <div class="usuario-chip">
            <div class="avatar">#{empty sesion.nombre ? '' : sesion.nombre.substring(0,1)}</div>
            <span class="nombre">#{sesion.nombre}</span>
          </div>

          <h:form>
            <h:commandButton value="Cerrar sesi&#243;n"
                             action="#{loginBean.salir}"
                             styleClass="btn btn-secundario btn-chico"/>
          </h:form>
        </div>
      </header>

      <main class="contenido">

        <div class="mensajes">
          <h:messages infoClass="info" errorClass="error" layout="list"
                      showDetail="false" showSummary="true"/>
        </div>

        <ui:insert name="contenido"/>

      </main>

    </div>
  </div>

</h:body>
</html>

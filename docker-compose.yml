# Aura Cycles completo con un solo comando:  docker compose up --build
# App en https://localhost:8443/repuestos (http://localhost:8080 redirige). Certificado autofirmado: el navegador avisa la primera vez
# Mercado Pago simulado en http://localhost:8089/__modo, proveedor SOAP simulado en http://localhost:8090/__modo
# y modelo de IA simulado en http://localhost:8092/__modo. La API REST queda en https://localhost:8443/repuestos/api/v1
# DB_PASSWORD es la clave de la base local del contenedor (no se publica afuera de docker). Se puede cambiar con un .env

services:

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: repuestos_bici
      MYSQL_USER: aura
      MYSQL_PASSWORD: ${DB_PASSWORD:-aura-local}
      TZ: America/Argentina/Buenos_Aires
    # El esquema ya no se carga aca: lo crea el servicio flyway con las migraciones de sql/migraciones.
    # Por TCP y no por socket: asi el chequeo no da OK con el servidor temporal del arranque
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uaura -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 60

  # Migraciones versionadas (V1, V2, ...). Corre una vez, aplica las que falten y termina.
  # Si la base ya existia de antes (cargada con el viejo schema.sql) la toma como V4 y no toca nada
  flyway:
    image: flyway/flyway:11
    command: ["migrate"]
    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/repuestos_bici?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: aura
      FLYWAY_PASSWORD: ${DB_PASSWORD:-aura-local}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_BASELINE_ON_MIGRATE: "true"
      FLYWAY_BASELINE_VERSION: "4"
      FLYWAY_CONNECT_RETRIES: "30"
    volumes:
      - ./sql/migraciones:/flyway/sql:ro
    depends_on:
      mysql:
        condition: service_healthy

  artemis:
    image: apache/activemq-artemis:2.42.0
    environment:
      ANONYMOUS_LOGIN: "true"
    volumes:
      # El journal del broker queda en un volumen: los mensajes pendientes sobreviven a un stop o a un down
      - artemis-datos:/var/lib/artemis-instance
      - ./docker/artemis/broker.properties:/var/lib/artemis-instance/etc-override/broker.properties:ro
    ports:
      - "8161:8161"

  mercadopago-mock:
    image: eclipse-temurin:21-jdk
    command: ["java", "/mock/MockMercadoPago.java", "8089"]
    environment:
      MOCK_URL_PUBLICA: http://localhost:8089
    volumes:
      - ./src/test/java/ar/edu/uade/repuestos/integracion:/mock:ro
    ports:
      - "8089:8089"

  proveedor-mock:
    image: eclipse-temurin:21-jdk
    command: ["java", "/mock/MockProveedorSoap.java", "8090"]
    environment:
      MOCK_WSDL: /wsdl/ProveedorMayorista.wsdl
    volumes:
      - ./src/test/java/ar/edu/uade/repuestos/integracion:/mock:ro
      - ./src/main/resources/wsdl:/wsdl:ro
    ports:
      - "8090:8090"

  # Modelo de IA simulado: clasifica por palabras clave, para la demo sin clave ni internet.
  # Va en el 8092 porque el 8091 lo usa ZAP en el escaneo activo (seguridad/zap-activo.sh)
  ia-mock:
    image: eclipse-temurin:21-jdk
    command: ["java", "/mock/MockLLM.java", "8092"]
    volumes:
      - ./src/test/java/ar/edu/uade/repuestos/integracion:/mock:ro
    ports:
      - "8092:8092"

  app:
    build: .
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-aura-local}
      # Mercado Pago: por defecto el simulado. Para el real van las tres juntas en un .env (ver .env.example)
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_BASE_URL: ${MP_BASE_URL:-http://mercadopago-mock:8089}
      AURA_URL: ${AURA_URL:-https://localhost:8443/repuestos}
      PROVEEDOR_URL: http://proveedor-mock:8090/proveedor
      # IA prendida contra el modelo simulado. Para el modelo real: IA_URL=https://api.anthropic.com e IA_API_KEY en un .env
      IA_MODERACION: ${IA_MODERACION:-true}
      IA_URL: ${IA_URL:-http://ia-mock:8092}
      IA_API_KEY: ${IA_API_KEY:-simulado}
      # Clave de firma de los JWT de la API. Vacia: la app genera una al arrancar
      JWT_SECRET: ${JWT_SECRET:-}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "8080:8080"
      - "8443:8443"
    depends_on:
      flyway:
        condition: service_completed_successfully
      artemis:
        condition: service_started
      mercadopago-mock:
        condition: service_started
      proveedor-mock:
        condition: service_started
      ia-mock:
        condition: service_started

volumes:
  artemis-datos:

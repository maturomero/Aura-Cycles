# Reintentos del broker: si un MDB falla (por ejemplo, Mercado Pago caido) el mensaje vuelve cada 10 s,
# hasta 10 veces, y despues va a la DLQ. Se aplica al arrancar Artemis.
addressSettings."#".redeliveryDelay=10000
addressSettings."#".maxRedeliveryDelay=60000
addressSettings."#".maxDeliveryAttempts=10
addressSettings."#".deadLetterAddress=DLQ
addressSettings."#".autoCreateDeadLetterResources=true
# Por defecto Artemis deja de aceptar mensajes con el disco al 90% y el que publica se queda esperando.
# En una notebook eso pasa seguido, asi que solo frena con el disco lleno de verdad.
maxDiskUsage=100
